<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real numbers on
             iOS; without it every inset is 0 and notch handling silently does nothing.
             interactive-widget keeps the on-screen keyboard from covering the name field. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Cairo+Play:wght@700&display=swap" rel="stylesheet">
        <title>HIT 7</title>
        <!-- Updated favicon links with base path -->
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
        <!-- Absolute, and at the root. The icons inside it are absolute too: the old
             manifest lived under /images/ and pointed at /android-chrome-192x192.png,
             which the catch-all route answered with this page, so every installed copy
             got a blank icon. -->
        <link rel="manifest" href="/site.webmanifest">

        <!-- Installed on a phone. theme-color paints the status bar.
             NOT black-translucent: that puts the page under the status bar, and while
             the game board pads itself with env(safe-area-inset-top), the landing page
             does not - so the logo ended up behind the Dynamic Island. "black" makes iOS
             reserve the bar instead, which no screen can then collide with. It also
             makes env(safe-area-inset-top) report 0, so the padding rules that do exist
             quietly become no-ops rather than doubling up. -->
        <meta name="theme-color" content="#1a1a2e">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <meta name="apple-mobile-web-app-title" content="HIT 7">
        <!-- Add base tag to ensure relative paths work correctly -->
        <base href="/">
        <link rel="stylesheet" href="style.css" type="text/css">
    </head>
    <body>
        <!-- Add audio elements before lobby screen -->
        <audio id="buttonClick" src="audio/click.mp3" preload="auto"></audio>
        <audio id="cardFlip" src="audio/flip.mp3" preload="auto"></audio>
        <audio id="bustSound" src="audio/bust.mp3" preload="auto"></audio>
        <audio id="winSound" src="audio/win.mp3" preload="auto"></audio>
        <audio id="roundEnd" src="audio/round-end.mp3" preload="auto"></audio>
        <audio id="standSound" src="audio/stand.mp3" preload="auto"></audio>
        <audio id="bustCardSound" src="audio/bust-card.mp3" preload="auto"></audio>
        <audio id="secondChanceSound" src="audio/second-chance.mp3" preload="auto"></audio>
    
        <!-- Lobby Screen -->
        <div class="lobby-screen">
            <div class="game-logo">
                <img src="/images/hit7-logo.png" alt="HIT 7 Logo" class="logo-image">
            </div>

            <div class="menu-container">
                <form class="lobby-form" id="lobbyForm" autocomplete="off">
                    <div class="field">
                        <label for="playerName">YOUR NAME</label>
                        <input type="text" id="playerName" name="playerName"
                               maxlength="20" minlength="3" placeholder="3-20 characters"
                               autocomplete="nickname" spellcheck="false">
                    </div>

                    <button type="button" id="createGame" class="lobby-button">
                        🎮 Create New Game
                    </button>

                    <div class="lobby-divider"><span>or join a friend</span></div>

                    <div class="field">
                        <label for="gameId">GAME CODE</label>
                        <input type="text" id="gameId" name="gameId"
                               maxlength="5" placeholder="ABC12"
                               inputmode="text" autocapitalize="characters"
                               autocomplete="off" spellcheck="false" class="code-input">
                        <span class="field-hint">Coming back to a game you left? Enter the
                            same code and the same name.</span>
                    </div>

                    <button type="button" id="joinGame" class="lobby-button blue">
                        🔗 Join Game
                    </button>

                    <p class="lobby-error" id="lobbyError" role="alert" hidden></p>

                    <button type="button" id="tutorialButton" class="lobby-button tutorial-button">
                        📖 How To Play
                    </button>
                </form>
            </div>
        </div>

        <!-- Game Area -->
        <div id="gameArea" class="game-container" style="display: none;">
            <div class="game-header">
                <div class="header-left">
                    <div class="game-logo">
                        <img src="/images/hit7-logo.png" alt="HIT 7 Logo" class="logo-image">
                    </div>
                </div>
                <div class="header-right">
                    <div class="game-code-display">
                        <span class="share-link" id="shareLink"></span>
                    </div>
                    <!-- Phone-only: opens the remaining-deck sheet. Hidden on desktop, where the
                         full pile is on the board already. -->
                    <button id="deckButton" class="deck-button" type="button"
                            aria-haspopup="dialog" aria-expanded="false"
                            aria-label="Cards left in the deck">
                        <span class="deck-button-count" id="deckButtonCount">0</span>
                        <span class="deck-button-label">left</span>
                        <span class="deck-button-last" id="deckButtonLast">—</span>
                    </button>

                    <!-- Everything that is not played with. Sound and the rules are here
                         for everyone; the two that end or unwind the game are host-only
                         and sit below a divider so neither is next to a harmless one.
                         The dot on the gear is how a muted game says so with the menu
                         shut, which the old standalone speaker button did by itself. -->
                    <div class="settings-menu-wrap">
                        <button id="settingsButton" class="game-button" title="Settings"
                                aria-label="Settings" aria-haspopup="true" aria-expanded="false"
                                aria-controls="settingsMenu">⚙️<span class="button-label">Settings</span></button>

                        <div id="settingsMenu" class="settings-menu" role="menu"
                             aria-labelledby="settingsButton" hidden>
                            <!-- What everybody agreed to play. It sat in the header as a
                                 badge, where it was read once and then took up room for
                                 the rest of the game. It is not a control, so it is a
                                 caption rather than a row you can press. -->
                            <p class="settings-mode" id="settingsMode" hidden></p>

                            <button class="settings-item" role="menuitemcheckbox" type="button"
                                    id="settingsSound" aria-checked="true">
                                <span class="settings-icon" id="settingsSoundIcon">🔊</span>
                                <span class="settings-text">
                                    <span class="settings-label">Sound</span>
                                </span>
                                <span class="settings-state" id="settingsSoundState">On</span>
                            </button>

                            <button class="settings-item" role="menuitem" type="button"
                                    id="settingsTutorial">
                                <span class="settings-icon">📖</span>
                                <span class="settings-text">
                                    <span class="settings-label">How to play</span>
                                </span>
                            </button>

                            <div class="settings-group" id="settingsHostGroup" hidden>
                                <p class="settings-group-title">Host</p>

                                <button class="settings-item" role="menuitem" type="button"
                                        id="settingsToLobby">
                                    <span class="settings-icon">🔄</span>
                                    <span class="settings-text">
                                        <span class="settings-label">Return to lobby</span>
                                        <span class="settings-hint">Change deck, score, bots</span>
                                    </span>
                                </button>

                                <button class="settings-item is-danger" role="menuitem" type="button"
                                        id="settingsEndGame">
                                    <span class="settings-icon">🏁</span>
                                    <span class="settings-text">
                                        <span class="settings-label">End game</span>
                                        <span class="settings-hint">Stop now, whoever leads wins</span>
                                    </span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Phone-only: says whose turn it is without costing a whole panel. -->
            <div class="turn-strip" id="turnStrip" aria-live="polite">
                <span class="turn-pip"></span>
                <span id="turnStripText">Waiting…</span>
            </div>

            <!-- What just happened, on every screen. It is also the way into the full
                 log: the History button that used to sit in the header was doing the
                 same job from further away, so the strip took it over and the header
                 lost a button. The chevron is what says the whole row is a button. -->
            <button class="last-action" id="lastAction" type="button"
                    aria-label="Last action — open the full history" aria-live="polite">
                <span class="last-action-icon" id="lastActionIcon" aria-hidden="true">▶️</span>
                <span class="last-action-text" id="lastActionText">Waiting for the first move…</span>
                <span class="last-action-more" aria-hidden="true">›</span>
            </button>

            <div class="game-board">
                <div class="deck-area">
                    <div class="discard-info">
                        <div class="deck-stats-container">
                            <div class="deck-stat-item">
                                <span class="stat-label">CARDS LEFT:</span>
                                <span class="stat-value" id="deckCount">93</span>
                            </div>
                            <div class="deck-stat-item">
                                <span class="stat-label">LAST CARD DRAWN:</span>
                                <div id="lastCardDrawn" class="last-card-container"></div>
                            </div>
                            <div class="deck-stat-item">
                                <span class="stat-label">PLAYING TO:</span>
                                <span class="stat-value" id="targetScore">200</span>
                            </div>
                        </div>
                        <div class="remaining-pile" id="discard"></div>  <!-- Changed id kept for compatibility -->
                    </div>
                </div>

                <!-- On phones the opponents render as tiles in the rail and the player's own
                     panel renders into #myHand. On desktop both sit empty and every panel goes
                     into #playersContainer as before. -->
                <div class="opponent-rail" id="opponentRail"></div>
                <div id="playersContainer" class="players-container"></div>
                <div class="my-hand" id="myHand"></div>
            </div>
        </div>

        <!-- Move controls out of gameArea so they are fixed to the viewport -->
        <div class="controls" style="display: none;">
            <button id="flipCard" class="game-button blue">HIT</button>
            <button id="standButton" class="game-button orange">Stand</button>
        </div>

        <!-- Popup Container -->
        <div id="popupContainer"></div>

        <script src="/socket.io/socket.io.js"></script>
        <script src="client.js"></script>
    </body>
</html>
